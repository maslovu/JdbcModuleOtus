# 1. Headless Service для стабильных DNS-имен подов
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  labels:
    app: postgres
spec:
  clusterIP: None # Делает сервис "Headless" (без единого IP)
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

---
# 2. Обычный Service для доступа приложений (балансировщик)
apiVersion: v1
kind: Service
metadata:
  name: postgres-service # Ссылка на внутреннее DNS-имя
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

---
# 3. StatefulSet (основная логика)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: "postgres-headless" # Ссылка на Headless Service выше
  replicas: 1 # Для начала можно 1, для кластера можно 3+
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # Опционально: PriorityClass, чтобы DB не убили при нехватке памяти
      terminationGracePeriodSeconds: 10 # Время на корректное завершение
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: "otus"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "postgres" # В проде используйте Secret
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              # Важно: для PostgreSQL нужно, чтобы владельцем папки был пользователь postgres (uid 70)
              # Если этого не сделать, БД не сможет писать в Volume.
              subPath: data
          # Readiness/Liveness пробы (обязательны для StatefulSet)
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 10

  # 4. Магия StatefulSet: шаблон создания дисков
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "hostpath" # Ваш StorageClass (gp2, pd-ssd и т.д.)
        resources:
          requests:
            storage: 10Gi