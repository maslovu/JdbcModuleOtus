apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-app-deployment
  labels:
    app: api-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-app
  template:
    metadata:
      labels:
        app: api-app
    spec:
      containers:
        - name: api-app-container
          image: books-maslov-2.2.0:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-service:9092"

            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-service:5432/otus"
            - name: SPRING_DATASOURCE_USERNAME
              value: "postgres"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "postgres"

            - name: SPRING_REDIS_HOST
              value: "redis-service"
            - name: SPRING_DATA_REDIS_HOST
              value: "redis-service"
            # Передача пароля через переменную окружения (лучше брать из Secret)
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: password
---
apiVersion: v1
kind: Service
metadata:
  name: api-app-service
spec:
  type: NodePort # Открывает порт наружу на вашем компьютере
  selector:
    app: api-app
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080